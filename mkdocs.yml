site_name: Bee Flow
site_description: AI-native workspace for Nextcloud — chat with your Files, Mail, Calendar, Deck, Notes, Tasks, Contacts and Talk.
site_url: https://docs.beeflow.ai
repo_url: https://github.com/Bee-Flow/docs
repo_name: Bee-Flow/docs
edit_uri: edit/main/docs/
copyright: Copyright &copy; Bee Flow B.V.

theme:
  name: material
  language: en
  logo: img/logo.svg
  favicon: img/favicon.ico
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.prune
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

hooks:
  - hooks/screenshots.py

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Bee-Flow
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/beeflow_ai
  generator: false

